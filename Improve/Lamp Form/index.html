<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Illuminated Form</title>
</head>

<body>

    <!-- Main room container -->
    <div class="room-container" id="room">

        <!-- Hanging lamp -->
        <div class="lamp-system">

            <div class="ceiling-wire"></div>

            <div class="lamp-shade"></div>

            <div class="lamp-bulb" id="lamp-bulb"></div>

            <!-- Pull cord -->
            <div
                class="pull-cord"
                id="pull-cord"
                title="Click to turn light on/off"
            >
                <div class="cord-string"></div>

                <div class="cord-handle">
                    <i class="fas fa-power-off"></i>
                </div>
            </div>

        </div>

        <!-- Spotlight -->
        <div class="spotlight-cone" id="spotlight-cone"></div>

        <!-- Light controls -->
        <div class="light-controls-bar">

            <span class="light-status" id="light-status-text">
                Light is OFF
            </span>

            <div class="mood-swatches">

                <button
                    type="button"
                    class="swatch active"
                    data-color="amber"
                    title="Warm Amber"
                    style="background: #f59e0b"
                ></button>

                <button
                    type="button"
                    class="swatch"
                    data-color="cyan"
                    title="Neon Cyan"
                    style="background: #06b6d4"
                ></button>

                <button
                    type="button"
                    class="swatch"
                    data-color="emerald"
                    title="Emerald Glow"
                    style="background: #10b981"
                ></button>

            </div>

        </div>

        <!-- Login card: nasa loob ng room -->
        <div class="lamp-login-card" id="lamp-login-card">

            <div class="card-glow-badge">
                <i class="fas fa-sun"></i>
                Illuminated Form
            </div>

            <h2>HTML Form</h2>

            <p class="lamp-sub">
                Pull the lamp cord above to illuminate the form.
            </p>

            <!-- Your original form -->
            <form id="form">

                <div class="lamp-input-group">

                    <label for="fullname">Full name:</label>

                    <div class="input-inner">
                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            placeholder="Your Full name"
                            required
                        >
                    </div>

                </div>

                <div class="lamp-input-group">

                    <label for="password">Password:</label>

                    <div class="input-inner">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Password"
                            required
                        >
                    </div>

                </div>

                <div class="lamp-input-group">

                    <label for="country">Country:</label>

                    <div class="input-inner">
                        <select id="country" name="country">
                            <option value="Pilipinas">Pilipinas</option>
                            <option value="Canada">Canada</option>
                            <option value="Japan">Japan</option>
                            <option value="Korea">Korea</option>
                        </select>
                    </div>

                </div>

                <div class="button-btn">

                    <button type="submit" class="btn-lamp-submit">
                        Submit
                    </button>

                    <button type="button" id="dark">
                        Dark
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="index.js"></script>

</body>
</html>
