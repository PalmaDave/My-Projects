<div>
<!-- Container/div para sa registration form -->

<br>
<!-- line break -->

<input type="firstname" id="firstname" placeholder="First Name">
<!-- textbox for firstname -->
<!-- id="firstname" gagamitin sa JS -->
<!-- placeholder = text sa loob ng input -->

<input type="lastname" id="lastname" placeholder="Last Name">
<!-- textbox for lastname -->

<label for="birthday">Birthday:</label>
<!-- text label para sa birthday input -->

<input type="date" id="birthday" name="birthday">
<!-- Date picker -->

<br>

<select id="slcCountry">
<!-- Dropdown/select menu -->

<option value="Philippines">Philippines</option>
<!-- Kapag pinili, value = Philippines -->

<option value="Japan">Japan</option>
<!-- Japan option -->

<option value="Singapore">Singapore</option>
<!-- Singapore option -->

</select>

<br>

<input type="checkbox" id="chkAgree">
<!-- Checkbox para sa privacy policy -->

<label for="chkAgree">
Agree to <b>Privacy Policy</b>
</label>
<!-- label ng checkbox -->
<!-- <b> = bold text -->

<br>

<input type="radio" 
name="sex" 
id="rbMale" 
value="Male">
<!-- Radio button Male -->
<!-- name="sex" para grouped sila -->

<label for="rbMale">Male</label>

<input type="radio" 
name="sex" 
id="rbFemale" 
value="Female">
<!-- Radio button Female -->

<label for="rbFemale">Female</label>

<br>

<button onclick="signIn()">
Sign In
</button>
<!-- Kapag pinindot ang button
tatawagin ang function na signIn() -->

</div>

<hr/>
<!-- Horizontal line separator -->

<div>
<!-- Lalagyan ng output/result -->

<p id="lblFullName">
FullName
</p>
<!-- Dito ilalagay fullname -->

<p id="lblBirthday">
Birthday
</p>
<!-- Dito ilalagay birthday -->

<p id="lblCountry">
Country
</p>
<!-- Dito ilalagay country -->

<p id="lblSex">
Sex
</p>
<!-- Dito ilalagay sex -->

</div>
