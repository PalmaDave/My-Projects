<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Temperature Converter</title>
</head>
<body>
    <div class="container">
        <h2 style="font-size: 35px;">Temperature Converter</h2>
        <div class="temp">
            <label for="celsius" class="sr-only">Celsius:</label>
            <input 
            type="number"
            id="celsius"
            placeholder="Celsius"
            class="input">
        </div>
        <div class="temp">
            <label for="fahrenheit" class="sr-only">Fahrenheit:</label>
            <input 
            type="number"
            id="fahrenheit"
            placeholder="Fahrenheit"
            class="input">
        </div>
        <div class="temp">
            <label for="kelvin" class="sr-only">Kelvin:</label>
            <input 
            type="number"
            id="kelvin"
            placeholder="Kelvin"
            class="input">
        </div>

        <div class="buttons">
        <button class="convert-btn" onclick="convertTemp()">Convert</button>
        <button class="reset-btn" onclick="resetTemp()">Reset</button>
        </div>
    </div>
    
</body>
     <script src="practice.js"></script>
</html>
