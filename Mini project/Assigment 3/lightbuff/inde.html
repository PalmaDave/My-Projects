<!DOCTYPE html>
<html>
    <head>
     <title>Light bulboff</title>        
    </head>
    <body>
        <h2>Ligh Bulb Switch</h2>
        <p>Click the button belows to  turn the ligh on or off.</p>
      
     <img id="myImage" src="pic_bulboff.gif" width="100" height="180">
    <p>
        <button type="button" onclick="light(1)">Light On</button>
        <button type="button" onclick="light(0)">Light Off</button>
    </p>

     <audio id="song" src="pahintulot.mp3"></audio>

        <script>
            function light(sw){
                let pic;
                if(sw == 0){
                    pic = "pic_bulboff.gif"
                    song.pause();
                    song.currentTime = 0;
                }else{
                    pic = "pic_bulbon.gif"
                    song.play();
                }
                document.getElementById("myImage").src = pic;
            }
        </script>



    </body>
</html>
