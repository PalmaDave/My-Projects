<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Cafe Menu</title>
  </head>
  <body>
    <div class="menu">
    <main>
      <h1 style="font-family: Arial;font-size: 40px;">CAMPER CAFE</h1>
      <p style="font-family: italic;">Est. 2020</p>
      <hr style="height: 4px;border-color: brown;background-color: brown;border-width: 1px;">
      <section>
        <h2 style="font-size: 30px;">Coffee</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/css-cafe/coffee.jpg"alt="coffee icon">
        <article class="item">
            <p class="flavor">French Vanilla</p><p class="price">3.00</p>
        </article>
        <article class="item">
             <p class="flavor">Caramel Macchiato</p><p class="price">3.75</p>
        </article>
        <article class="item">
            <p class="flavor">Pumpkin Spice</p><p class="price">3.50</p>
        </article>
        <article class="item">
            <p class="flavor">Hazelnut</p><p class="price">4.00</p>
        </article>
        <article class="item">
            <p class="flavor">Mocha</p><p class="price">4.50</p>
        </article>
      </section>
      <section>
          <h2 style="font-family: Arial;">Desserts</h2>
           <img src="https://cdn.freecodecamp.org/curriculum/css-cafe/pie.jpg"alt="pie icon">
          <article class="item">
            <p class="dessert">Donut</p><p class="price">1.50</p>
          </article>
             <article class="item">
            <p class="dessert">Cherry Pie</p><p class="price">2.75</p>
          </article>
             <article class="item">
        <p class="dessert">Cheesecake</p><p class="price">3.00</p>
          </article>
             <article class="item">
      <p class="dessert">Cinnamon Roll</p><p class="price">2.50</p>
          </article>
        </section>
    </main>
    <hr style="height: 4px;border-color: brown;background-color: brown;border-width: 1px;">
    <footer>
        <p>
            <a href="https://www.100jsprojects.com/project/age-calculator" target="_blank">Visit our Website</a>
        </p>
        <p class="address">123 Free Code Camp Drive</p>
    </footer>
</div>
  </body>
</html>
