<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>Student Grade Management System</h1>
        </header>

        <main class="main-content">
            <section class="form-card">
                <h2>Add / Edit Student</h2>
                <form id="student-form">
                 <input type="hidden" id="student-id"/>
                 
                 <div class="form-group">
                    <label for="student-name">Full Name</label>
                    <input type="text" id="student-name" required placeholder="Juan Cruz">
                </div>

                 <div class="form-group">
                    <label for="course">Course & Section</label>
                    <input type="text" id="course" required placeholder="BSCS 4E">
                </div>

                <div class="form-group">
                    <label for="prelim">Prelim Grade</label>
                    <input type="number" id="prelim" min="50" max="100" step="0.1" required>
                </div>
                
                <div class="form-group">
                    <label for="midterm">Midterm Grade</label>
                    <input type="number" id="midterm" min="50" max="100" step="0.1" required>
                </div>

               <div class="form-group">
                 <label for="final">Final Grade</label>
                <input type="number" id="final" min="50" max="100" step="0.1" required>
               </div>

               <button type="submit" id="btn-save">Save Student Record</button>
               <button type="button" id="btn-cancel" class="btn-secondary" style="display:none;">Cancel Edit</button>
                </form>
            </section>

            <section class="dashboard-card">
                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-label">Total Students</span>
                       <span id="stat-total" class="stat-value">0</span>
                    </div>

                    <div class="stat-box">
                        <span class="stat-label">Class Average</span>
                       <span id="stat-avg" class="stat-value">0.00</span>
                    </div>

                    <div class="stat-box">
                        <span class="stat-label">Passing Rate</span>
                        <span id="stat-pass" class="stat-value">0%</span>
                    </div>
                </div>

                <div class="table-controls">
                    <input type="text" id="search-in" placeholder="Search student name...">
                    <select id="filter-status">
                        <option value="all">All Records</option>
                        <option value="passed">Passed Only</option>                  
                        <option value="failed">Failed Only</option>
                    </select>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Course</th>
                                <th>Average</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="student-table-body">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    
</body>
   <script src="index.js"></script>
</html>
