<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Tip-Calculator</title>
</head>
<body>

  <div class="container">

    <h2>Tip Calculator</h2>

    <p>Enter the bill amount and tip percentage to calculate the total</p>
     
    <input type="number" id="bill-amount" placeholder="Bill amount:">

    <input type="number" id="tip-percent" placeholder="Tip percentage:">

    <br>

        <div class="tip-buttons">
            <button class="tip-btn" data-tip="5">5%</button>
            <button class="tip-btn" data-tip="10">10%</button>
            <button class="tip-btn" data-tip="15">15%</button>
            <button class="tip-btn" data-tip="20">20%</button>
            <button class="tip-btn" data-tip="25">25%</button>
        </div>
  
        <div class="action-btn">
        <button id="calculate">Calculate</button>
        <button id="reset">Reset</button>
        <button id="black">Dark mode</button>
        </div>

        <p id="error-message"></p>
       
      <p>Tip Amount: ₱<span id="tip-amount">0.00</span></p>
   
     <p>Total: ₱<span id="total">0.00</span></p>

        <label for="total">Total</label>
        <span id="total"></span>
    </div>
    <script src="index.js"></script>
    
</body>
</html>
