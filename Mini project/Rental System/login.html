<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Apartment Rental System - Login</title>

    <link rel="stylesheet" href="login.css">

</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                🏷️
            </div>

            <h1>Apartment Rental</h1>

            <p class="subtitle">
                Management System
            </p>


            <form id="login-form">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>


                <p id="login-message"></p>

            </form>


            <div class="demo-accounts">

                <h3>Demo Accounts</h3>

                <p>
                    <strong>Admin:</strong>
                    admin@gmail.com / admin123
                </p>

                <p>
                    <strong>Customer:</strong>
                    juan@gmail.com / juan123
                </p>
            
                <p style="text-align: center; margin-top: 15px;">
                    Don't have an account?
                  <a href="register.html">Register here</a>
               </p>
            </div>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
