```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <div class="register-container">
        <div class="register-card">

            <div class="logo">🏠</div>

            <h1>Create Account</h1>
            <p class="subtitle">Apartment Rental System</p>

            <form id="register-form">

                <div class="form-group">
                    <label for="register-name">Full Name</label>
                    <input type="text" id="register-name"
                           placeholder="Juan Cruz" required>
                </div>

                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email"
                           placeholder="juan@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="register-phone">Phone Number</label>
                    <input type="tel" id="register-phone"
                           placeholder="09123456789" required>
                </div>

                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password"
                           minlength="6" placeholder="At least 6 characters"
                           required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password"
                           minlength="6" placeholder="Enter password again"
                           required>
                </div>

                <button type="submit" class="register-btn">
                    Register Account
                </button>

                <p id="register-message" role="status"></p>

            </form>

            <p class="login-link">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

            <p class="approval-note">
                Your account must be approved by the admin before you
                can log in.
            </p>

        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>
```
