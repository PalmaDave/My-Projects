<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Input with Text Fields</title>
  </head>
<body>
  <h2>User Input Example</h2>
  <!-- Input fields -->
  <label for="name">Enter your name:</label>
  <input type="text" id="name" placeholder="Your name"><br><br>
  <label for="color">Enter your favorite color:</label>
  <input type="text" id="color" placeholder="Your favorite color">
  <br><br>
<!-- Buttons -->
  <button onclick="displayGreeting()">Submit</button>
  <button onclick="clearFields()">Clear</button>
<!-- Output -->
  <h3 id="greeting"></h3>
  <script>
  // Function to display greeting
  function displayGreeting() {
  const name = document.getElementById("name").value;
  const color = document.getElementById("color").value;
  if(name === "" || color === "") {
  alert("Please fill in both fields!");
  return;
  }
    document.getElementById("greeting").textContent = "Hello, " + name + "! Your favorite color is " + color + ".";
    console.log("Hello, " + name + "! Your favorite color is " + color + ".");
    }
    // Function to clear inputs and output
    function clearFields() {
    document.getElementById("name").value = "";
    document.getElementById("color").value = "";
    document.getElementById("greeting").textContent = "";
    }
   </script>
  </body>
</html>
