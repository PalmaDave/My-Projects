<!DOCTYPE html>
<html>
  
  <head> 
    <style>
       p{   /* Lahat ng <p> tag ay maaapektuhan */
        color:blue;
        font-size:10px;
       }

       h1{  /* selector*/
        color:red; /*property*/
       }

    </style>
    
 
  </head>

    <body> 
        <h1>Heading</h1>
        <p>Content 1</p>
        <p>Content 2</p>
        <p>Content 3</p>
    
    </body>

</html>
