<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration form</title>
    <link rel = "stylesheet" href="regis.css">
</head>
<body>
    <h1>Student Registration form</h1>
    <div class="form-container">
    <form>
        <label>Full Name:</label> <br> <br>
        <input type="text" name="fullname" placeholder="Enter your name" required> <br><br>

        <label>Email:</label><br> <br>
        <input type="email" name="email" placeholder = "Enter your email" required> <br><br>

        <label>Password:</label><br><br>
        <input type="password" name="password" placeholder = "Enter your password" required> <br><br>

        <label>Gender:</label><br><br>
        <input type="radio" name="gender"/>Male
        <input type="radio" name="gender"/>Female
        <input type="radio" name="gender"/>Others <br> <br>

        <label>Skills:</label><br><br>
        <input type="checkbox"/>HTML
        <input type="checkbox"/>CSS
        <input type="checkbox"/>Javascript <br><br>

        <label>Date of Birth</label><br>
        <input type="date"/><br><br>

        <label>Address</label>
        <select>
            <option>Paranaque</option>
            <option>Las pinas</option>
            <option>Pasay</option>
        </select> <br><br>
          
        <label>Message</label><br>
        <textarea row="5" cols="40" placeholder="Enter your message"></textarea>
        <br>
    </form>
      <div class="ear-1"></div>
      <div class="ear-r"></div>
      <div class="panda-face"></div>
      <div class="blush-1"></div>
      <div class="blush-r"></div>
      <div class="eye-1">
        <div class="eyeball-1">         
        </div>
      </div>
      <div class="eye-r"></div>
      <div class="eyeball-r"></div>
      <div class="nose"></div>
      <div class="mouth"></div>
    </div>
    
    </div>
</body>
</html>
