<html> <!-- nagsisimula ang HTML document -->
<head> <!-- head section (dito nilalagay ang settings ng page tulad ng CSS link) -->
    <link rel="stylesheet" href="facebook.css"> <!-- kinokonek ang external CSS file para mag-apply ang design -->
     <script src="facebook.js" defer></script>
</head> <!-- end ng head section -->

<body> <!-- body section (dito lahat ng makikita sa webpage) -->

     <div class="container"> <!-- main container ng buong Facebook login page -->

        <h1>Facebook</h1> <!-- main title ng page -->

        <div class="login"> <!-- container ng login form (lahat ng inputs at button) -->

            <p>Log in to Facebook</p> <!-- instruction text sa user -->

            <div class="input-box"> <!-- wrapper ng email input at label (para sa floating effect) -->

                <input type="text" id="email" placeholder=" " required> <!-- input field para sa email or phone number -->

                <label for="email">Email address or Phone number</label> <!-- label na aakyat kapag may input -->

            </div> <!-- end ng email input box -->

            <div class="input-box"> <!-- wrapper ng password input at label -->

                <input type="password" id="password" placeholder=" " required> <!-- input field para sa password -->

                <label for="password">Password</label> <!-- label na aakyat kapag may input -->

            </div> <!-- end ng password input box -->

            <button>Login</button> <!-- button para mag-login -->

            <div class="account"> <!-- container ng links sa baba -->

                <a href="#">Forgotten account</a> <!-- link para sa password recovery -->

                <a href="#">Sign up for Facebook</a> <!-- link para sa paggawa ng account -->

            </div> <!-- end ng account links -->

        </div> <!-- end ng login form -->

     </div> <!-- end ng main container -->

</body> <!-- end ng body -->

</html> <!-- end ng HTML document -->
